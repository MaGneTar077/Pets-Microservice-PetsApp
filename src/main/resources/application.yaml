spring:
  application:
    name: pet-service

  cloud:
    gcp:
      project-id: ${GCP_PROJECT_ID}
      pubsub:
        enabled: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: "SET SESSION CHARACTERISTICS AS TRANSACTION ISOLATION LEVEL READ COMMITTED"

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  config:
    import: optional:file:.env[.properties]

app:
  security:
    # Namespace propio en lugar de spring.security.oauth2.resourceserver.*: así el autoconfig de
    # Boot no intenta construir su propio JwtDecoder y el único que existe es el de SecurityConfig,
    # que es el que valida iss y aud.
    jwks-uri: ${JWT_JWKS_URI:}               # {USER_SERVICE_URL}/.well-known/jwks.json
    issuer: ${JWT_ISSUER:myanimalog-user-service}
    audience: ${JWT_AUDIENCE:myanimalog-api}
    internal-api-key: ${INTERNAL_API_KEY:}

server:
  port: ${PORT:8081}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

supabase:
  url: ${SUPABASE_URL}
  key: ${SUPABASE_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never

services:
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:8080}